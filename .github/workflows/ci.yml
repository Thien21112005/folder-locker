name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore FolderLocker.slnx

      - name: Build (warnings are errors)
        run: dotnet build FolderLocker.slnx -c Release --no-restore

      - name: Test
        run: dotnet test FolderLocker.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  release:
    name: Publish release
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          # Bản đầy đủ: một file exe, không cần cài .NET
          dotnet publish FolderLocker/FolderLocker.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$version -o out/standalone
          # Bản nhỏ: cần .NET 10 Desktop Runtime
          dotnet publish FolderLocker/FolderLocker.csproj -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true -p:Version=$version -o out/framework

          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path out/standalone/FolderLocker.exe, user_guide.md -DestinationPath "dist/FolderLocker-$version-win-x64.zip"
          Compress-Archive -Path out/framework/FolderLocker.exe, user_guide.md -DestinationPath "dist/FolderLocker-$version-win-x64-framework-dependent.zip"
          Get-ChildItem dist/*.zip | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
